<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Operation Color Graph</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" href="https://steamcdn-a.akamaihd.net/steamcommunity/public/images/avatars/f7/f7e8a4db519769407d52c696c8478428ef20cf49_full.jpg">
        <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono:400,400i|IBM+Plex+Sans+Condensed:400,400i|IBM+Plex+Sans:100,100i,400,400i,700,700i|IBM+Plex+Serif:400,400i" rel="stylesheet">
        <style>
body {
    font-family: 'IBM Plex Mono', monospace;
}

canvas {
    background: #000;
}

#MainHeader {
    color: darkblue;
}
</style>
    </head>
    <body>
        <h1 id="MainHeader">Operation Color Graph</h1>
        <h3 id="AdditionHeader">Addition</h3>
        <canvas
            id = "AdditionCanvas"
            width="510"
            height="510"
            style="border:1px solid #000000;"
        ></canvas>
        <br>
        <br>
        <h3 id="MultiplicationHeader">Multiplication</h3>
        <canvas
            id = "MultiplicationCanvas"
            width="510"
            height="510"
            style="border:1px solid #000000;"
        ></canvas>
        <br>
        <br>
        <h3 id="PowerHeader">Exponentiation</h3>
        <canvas
            id = "PowerCanvas"
            width="510"
            height="510"
            style="border:1px solid #000000;"
        ></canvas>

        <p>`1234567890-=~!@#$%^&*()_+qwertyuiop[]\QWERTYUIOP{}</p>
        <p>|asdfghjkl;'ASDFGHJKL:"zxcvbnm,./ZXCVBNM>?"'</p>
        <script>
console.log("Hello World");
var canvas = document.getElementById("AdditionCanvas");
var width = canvas.scrollWidth;
var height = canvas.scrollHeight;
var ctx = canvas.getContext("2d")

var canvas2 = document.getElementById("MultiplicationCanvas");
var cty = canvas2.getContext("2d");

var canvas3 = document.getElementById("PowerCanvas");
var ctz = canvas3.getContext("2d");

var ranFlag = 1;

var ox = width/2;
var oy = height/2;
var inc = 1;
var pixSize = 1;
var scale;
var op;
var iop;

function getIOP() {
  if (op == add) {
    iop = subtract;
  } else if (op == multiply) {
    iop = divide;
  } else if (op == power) {
    iop = root;
  }
}

function add(a, b) {
  return a + b;
}

function subtract(a, b) {
  return a - b;
}

function multiply(a, b) {
  return a * b;
}

function divide(a, b) {
  return a / b;
}

function power(a, b) {
  return Math.pow(a, b);
}

function root(a, b) {
  return Math.pow(a, (1/b));
}

function orginToCanvas(x,y) {
  return [ox+x,oy-y]
}

function drawXYAxes() {
  ctx.beginPath();
  ctx.moveTo(0,oy);
  ctx.lineTo(width,oy);
  ctx.moveTo(ox,0);
  ctx.lineTo(ox,height);
  ctx.strokeStyle = "rgba(255,255,255,1)";
  ctx.stroke();
  //ctx.strokeStyle = "rgba(255,255,255,1)";
  //ctx.stroke();
}

function drawNumberLine(n,cvs) {
  for(var i = -ox; i < ox; i += inc) {
    var sy = n/scale;
    var sx = i/scale;
    var lx = iop(sx,sy);
    if (lx%2 == 0) {
      cvs.fillStyle = "hsl(0,100%, 0%)";
    } else if (Math.abs(lx%2) == 1){
      cvs.fillStyle = "hsl(0,100%, 100%)";
    } else {
      var per360 = (lx-Math.floor(lx))*360;
      var bw;
      if (Math.abs(lx-Math.round(lx)) < 0.00001) {
        if (Math.round(lx)%2 == 0) {
          bw = 0;
        } else {
          bw = 100;
        }
      } else {
        bw = 50;
      }
      //cvs.fillStyle = "hsl(" + per360 + ",100%, " + bw + "%)";
      cvs.fillStyle = "hsl(" + per360 + ",100%, 50%)";
      //ctx.fillStyle = "hsl(" + scale*lx + ",100%, 50%)";
    }
    coors = orginToCanvas(i,n);
    cvs.fillRect(coors[0], coors[1], pixSize, pixSize);
  }
}

function drawFunction(cvs) {
  for(var i = -oy; i < oy; i += inc) {
    drawNumberLine(i,cvs);
  }
}

var scaleUpFlag = 1;

function cycleScale() {
  if (scaleUpFlag) {
    scale++;
  } else {
    scale--;
  }

  if (scale == 255) {
    scaleUpFlag = 0;
  } else if (scale == 0) {
    scaleUpFlag = 1;
    scale++;
  }
}

function runOpG(f, cvs) {
  op = f;
  cvs.clearRect(0,0, width, height);
  getIOP();
  drawFunction(cvs);
}

function draw() {
  if (ranFlag) {
    scale = 84;
    //scale = 1;
    //cycleScale();

    runOpG(add, ctx);
    runOpG(multiply, cty);
    runOpG(power, ctz);

    //drawXYAxes();
    ranFlag = 0;
    console.log("Ran");
  }
}

var refreshEveryXseconds = 1;
setInterval(draw, refreshEveryXseconds*1000);
</script>
    </body>
</html>
